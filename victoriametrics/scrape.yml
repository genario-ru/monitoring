global:
  scrape_interval: 30s
  external_labels:
    environment: production
    stack: genario-monitoring

scrape_configs:
  - job_name: backend
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{BACKEND_VPS_DOMAIN}:3000"

  - job_name: backend-node
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{BACKEND_VPS_DOMAIN}:9100"

  - job_name: frontend-node
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{FRONTEND_VPS_DOMAIN}:9100"

  - job_name: monitoring-node
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{MONITORING_VPS_IP}:9100"

  - job_name: db-node
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{DB_VPS_IP}:9100"

  - job_name: postgres
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{DB_VPS_IP}:%{POSTGRES_EXPORTER_PORT}"

  - job_name: redis
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{DB_VPS_IP}:%{REDIS_EXPORTER_PORT}"
