global:
  scrape_interval: 30s
  external_labels:
    environment: production
    stack: genario-monitoring

scrape_configs:
  - job_name: backend
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{APP_VPS_IP}:3000"

  - job_name: app-node
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{APP_VPS_IP}:9100"

  - job_name: data-node
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{DATA_VPS_IP}:9100"

  - job_name: postgres
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{DATA_VPS_IP}:%{POSTGRES_EXPORTER_PORT}"

  - job_name: redis
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "%{DATA_VPS_IP}:%{REDIS_EXPORTER_PORT}"

