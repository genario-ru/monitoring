groups:
  - name: availability
    interval: 30s
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        annotations:
          summary: Backend target is down
          description: The backend scrape target has been unreachable for more than 2 minutes.

      - alert: BackendNodeDown
        expr: up{job="backend-node"} == 0
        for: 2m
        annotations:
          summary: Backend VPS host metrics are down
          description: The node_exporter target on the backend VPS has been unreachable for more than 2 minutes.

      - alert: FrontendNodeDown
        expr: up{job="frontend-node"} == 0
        for: 2m
        annotations:
          summary: Frontend VPS host metrics are down
          description: The node_exporter target on the frontend VPS has been unreachable for more than 2 minutes.

      - alert: DbNodeDown
        expr: up{job="db-node"} == 0
        for: 2m
        annotations:
          summary: DB VPS host metrics are down
          description: The node_exporter target on the db VPS has been unreachable for more than 2 minutes.

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        annotations:
          summary: PostgreSQL exporter is down
          description: The postgres_exporter target has been unreachable for more than 2 minutes.

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        annotations:
          summary: Redis exporter is down
          description: The redis_exporter target has been unreachable for more than 2 minutes.

  - name: backend
    interval: 30s
    rules:
      - alert: BackendHigh5xxRate
        expr: sum(rate(genario_http_requests_total{job="backend",status_class="5xx"}[5m])) > 0.1
        for: 10m
        annotations:
          summary: Backend 5xx rate is high
          description: Backend is returning more than 0.1 5xx responses per second for 10 minutes.

      - alert: BackendHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(genario_http_request_duration_seconds_bucket{job="backend"}[5m]))) > 1
        for: 10m
        annotations:
          summary: Backend p95 latency is high
          description: Backend p95 latency has been above 1 second for 10 minutes.

  - name: hosts
    interval: 30s
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (instance, job) (rate(node_cpu_seconds_total{mode="idle",job=~"backend-node|frontend-node|db-node"}[5m])) * 100) > 85
        for: 15m
        annotations:
          summary: Host CPU usage is high
          description: Host CPU usage has been above 85% for 15 minutes.

      - alert: HostLowMemory
        expr: (1 - (node_memory_MemAvailable_bytes{job=~"backend-node|frontend-node|db-node"} / node_memory_MemTotal_bytes{job=~"backend-node|frontend-node|db-node"})) > 0.9
        for: 15m
        annotations:
          summary: Host memory pressure is high
          description: Available memory has been below 10% for 15 minutes.

      - alert: HostDiskAlmostFull
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay",job=~"backend-node|frontend-node|db-node"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay",job=~"backend-node|frontend-node|db-node"})) > 0.9
        for: 15m
        annotations:
          summary: Root filesystem is almost full
          description: Root filesystem usage has been above 90% for 15 minutes.

  - name: postgres
    interval: 30s
    rules:
      - alert: PostgresTooManyConnections
        expr: sum by (instance) (pg_stat_activity_count{job="postgres"}) > 100
        for: 10m
        annotations:
          summary: PostgreSQL connection count is high
          description: PostgreSQL has had more than 100 active connections for 10 minutes.

  - name: redis
    interval: 30s
    rules:
      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes{job="redis"} / redis_memory_max_bytes{job="redis"} > 0.9 and redis_memory_max_bytes{job="redis"} > 0
        for: 10m
        annotations:
          summary: Redis memory usage is high
          description: Redis memory usage has been above 90% of maxmemory for 10 minutes.
